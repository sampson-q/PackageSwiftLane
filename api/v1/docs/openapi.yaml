openapi: "3.0.3"

info:
  title: PackageSwiftLane REST API
  version: "1.1.0"
  description: |
    REST interface to the PackageSwiftLane shipping and consolidation platform.

    The API exposes the operational core of the system — shipments, customers,
    recipients, pre-alerts, public tracking, catalog lookups and in-app
    notifications — behind stateless Bearer-token authentication.

    ## Authentication

    Obtain a token with `POST /auth/login` and send it on every protected call:

    ```http
    Authorization: Bearer <token>
    ```

    Tokens are opaque 64-character hex strings. Only a SHA-256 hash is persisted
    server-side; the raw value is shown once, at login, and cannot be retrieved
    again. Default lifetime is 24 hours (30 days when `remember_me` is set).

    ## Response envelope

    Every response — success or failure — is a JSON object with a stable shape:

    ```json
    { "success": true,  "data": { }, "meta": { } }
    { "success": false, "error": "not_found", "message": "…", "errors": { } }
    ```

    `meta` is present on paginated collections; `errors` is present only on
    field-level validation failures (HTTP 422).

    ## Pagination

    List endpoints accept `page` (1-based, default 1) and `per_page`
    (default 15, hard ceiling 100) and return a `meta` block describing the
    current window. Ordering is controlled per-resource via `sort` / `direction`.

    ## Data scoping

    Results are automatically narrowed to the caller's role. Customers
    (userlevel 1) see only their own records; agency operators (userlevel 6)
    are constrained to their agency; drivers (userlevel 3) to their assignments.
    Administrators and super-admins (userlevel 9) see everything.

  contact:
    name: PackageSwiftLane Platform Team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: Same-origin (relative) base path

security:
  - bearerAuth: []

tags:
  - { name: Auth,          description: "Token issuance and identity" }
  - { name: Shipments,     description: "Courier shipment lifecycle" }
  - { name: Customers,     description: "Customer (shipper) accounts" }
  - { name: Recipients,    description: "Recipient address book" }
  - { name: Tracking,      description: "Public, unauthenticated tracking" }
  - { name: Pre-alerts,    description: "Inbound-package pre-alerts" }
  - { name: References,    description: "Read-only catalog and lookup data" }
  - { name: Notifications, description: "In-app notification feed" }

paths:

  # ── Auth ─────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Issue an API token
      description: Validates credentials and returns a Bearer token plus the user profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:    { $ref: '#/components/schemas/LoginResult' }
        "401": { $ref: '#/components/responses/InvalidCredentials' }
        "403": { description: Account inactive }
        "422": { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the presented token
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties: { revoked: { type: boolean, example: true } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Return the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/User' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Shipments ────────────────────────────────────────────────────────────────
  /shipments:
    get:
      tags: [Shipments]
      summary: List shipments
      description: Paginated, filterable, role-scoped list of courier shipments.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search,    in: query, description: "Match against the full tracking number (prefix + number)", schema: { type: string } }
        - { name: status,    in: query, description: "Filter by status_courier id", schema: { type: integer } }
        - { name: agency_id, in: query, description: "Admin-only; agency operators are auto-scoped", schema: { type: integer } }
        - { name: sender_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to,   in: query, schema: { type: string, format: date } }
        - { name: sort,      in: query, schema: { type: string, enum: [order_id, order_date, total_order], default: order_id } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        "200":
          description: Paginated shipment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Shipment' } }
                  meta:    { $ref: '#/components/schemas/PaginationMeta' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Shipments]
      summary: Create a shipment
      description: |
        Creates a courier shipment and, optionally, its package lines in one call.
        Tariff totals are computed by downstream operational flows; this endpoint
        persists the order header and line items.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentRequest' }
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Shipment' }
                  message: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /shipments/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Shipments]
      summary: Retrieve a shipment
      description: Returns the shipment header plus its package lines and full tracking history.
      responses:
        "200":
          description: Shipment detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/ShipmentDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Shipments]
      summary: Cancel a shipment
      description: Soft-delete — sets the shipment to the cancelled status (14). The record is retained for audit.
      responses:
        "200":
          description: Shipment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id:      { type: integer }
                      deleted: { type: boolean, example: true }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /shipments/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    patch:
      tags: [Shipments]
      summary: Advance shipment status
      description: Updates `status_courier` and appends a tracking event with optional comments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:   { type: integer, description: "Target status_courier id (see GET /references/statuses)" }
                comments: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id:     { type: integer }
                      status: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }

  # ── Customers ────────────────────────────────────────────────────────────────
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search,    in: query, description: "Matches name, email, locker or phone", schema: { type: string } }
        - { name: active,    in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        "200":
          description: Paginated customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  meta:    { $ref: '#/components/schemas/PaginationMeta' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      summary: Create a customer
      description: Provisions a customer account (userlevel 1) with an auto-generated locker code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Customer' }
                  message: { type: string }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /customers/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Customers]
      summary: Retrieve a customer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Customer' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      summary: Update a customer
      description: Partial update; omitted fields retain their current value. Send `password` to rotate it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Customer' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /customers/{id}/addresses:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Customers]
      summary: List a customer's addresses
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Address' } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Recipients ───────────────────────────────────────────────────────────────
  /recipients:
    get:
      tags: [Recipients]
      summary: List recipients
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search,    in: query, description: "Matches name or email", schema: { type: string } }
        - { name: sender_id, in: query, description: "Staff-only; customers are auto-scoped to their own recipients", schema: { type: integer } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        "200":
          description: Paginated recipient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Recipient' } }
                  meta:    { $ref: '#/components/schemas/PaginationMeta' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Recipients]
      summary: Create a recipient
      description: Creates a recipient and, when address fields are supplied, an associated address row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRecipientRequest' }
      responses:
        "201":
          description: Recipient created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Recipient' }
                  message: { type: string }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /recipients/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Recipients]
      summary: Retrieve a recipient
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Recipient' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Recipients]
      summary: Update a recipient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, minLength: 2, maxLength: 80 }
                last_name:  { type: string, minLength: 2, maxLength: 80 }
                email:      { type: string, format: email }
                phone:      { type: string, maxLength: 30 }
      responses:
        "200":
          description: Recipient updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/Recipient' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /recipients/{id}/addresses:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Recipients]
      summary: List a recipient's addresses
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Address' } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Tracking ─────────────────────────────────────────────────────────────────
  /tracking/{order_no}:
    get:
      tags: [Tracking]
      summary: Track by number (public)
      description: |
        Resolves a tracking number against shipments, then customer packages,
        then consolidations, and returns the first match with its event history.
        No authentication required.
      security: []
      parameters:
        - name: order_no
          in: path
          required: true
          schema: { type: string }
          example: "SHIP-00042"
      responses:
        "200":
          description: Tracking result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/TrackingResult' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Pre-alerts ───────────────────────────────────────────────────────────────
  /pre-alerts:
    get:
      tags: [Pre-alerts]
      summary: List pre-alerts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: search,    in: query, description: "Matches tracking or provider", schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
      responses:
        "200":
          description: Paginated pre-alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/PreAlert' } }
                  meta:    { $ref: '#/components/schemas/PaginationMeta' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Pre-alerts]
      summary: Create a pre-alert
      description: |
        Accepts either JSON or `multipart/form-data`. Use multipart to attach an
        invoice file (`file_invoice`): JPG, PNG, GIF or PDF, up to 5 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePreAlertRequest' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreatePreAlertRequest'
                - type: object
                  properties:
                    file_invoice: { type: string, format: binary }
      responses:
        "201":
          description: Pre-alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/PreAlert' }
                  message: { type: string }
        "409": { $ref: '#/components/responses/Conflict' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /pre-alerts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    get:
      tags: [Pre-alerts]
      summary: Retrieve a pre-alert
      responses:
        "200":
          description: Pre-alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/PreAlert' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Pre-alerts]
      summary: Delete a pre-alert
      responses:
        "200":
          description: Pre-alert deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id:      { type: integer }
                      deleted: { type: boolean, example: true }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── References ───────────────────────────────────────────────────────────────
  /references/countries:
    get:
      tags: [References]
      summary: List countries
      responses: { "200": { $ref: '#/components/responses/ReferenceList' } }
  /references/states:
    get:
      tags: [References]
      summary: List states / provinces
      parameters:
        - { name: country_id, in: query, schema: { type: integer } }
      responses: { "200": { $ref: '#/components/responses/ReferenceList' } }
  /references/cities:
    get:
      tags: [References]
      summary: List cities
      parameters:
        - { name: state_id, in: query, schema: { type: integer } }
      responses: { "200": { $ref: '#/components/responses/ReferenceList' } }
  /references/couriers:
    get: { tags: [References], summary: List courier companies,  responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/statuses:
    get: { tags: [References], summary: List shipment statuses,  responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/packaging:
    get: { tags: [References], summary: List packaging types,    responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/shipping-modes:
    get: { tags: [References], summary: List shipping modes,     responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/delivery-times:
    get: { tags: [References], summary: List delivery times,     responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/categories:
    get: { tags: [References], summary: List item categories,    responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/offices:
    get: { tags: [References], summary: List offices,            responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/branches:
    get: { tags: [References], summary: List branch offices,     responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }
  /references/payment-methods:
    get: { tags: [References], summary: List payment methods,    responses: { "200": { $ref: '#/components/responses/ReferenceList' } } }

  # ── Notifications ────────────────────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: List the caller's notifications
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: unread, in: query, description: "When truthy, returns only unread items", schema: { type: boolean } }
      responses:
        "200":
          description: Paginated notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  meta:    { $ref: '#/components/schemas/PaginationMeta' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties: { updated: { type: integer } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id:   { type: integer }
                      read: { type: boolean, example: true }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: hex64

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: unauthorized, message: "Invalid or expired API token." }
    InvalidCredentials:
      description: Credentials rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: invalid_credentials, message: "Incorrect username or password." }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: forbidden, message: "Permission required: add_shipment" }
    NotFound:
      description: Resource does not exist or is out of scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: not_found, message: "Shipment #42 not found." }
    Conflict:
      description: Uniqueness constraint violated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: conflict, message: "An account with this email already exists." }
    ValidationError:
      description: One or more fields failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
          example:
            success: false
            error: validation_error
            message: Validation failed
            errors: { email: "The email must be a valid email address." }
    ReferenceList:
      description: Lookup rows
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:    { type: array, items: { $ref: '#/components/schemas/ReferenceItem' } }

  schemas:

    PaginationMeta:
      type: object
      properties:
        total:        { type: integer, example: 150 }
        per_page:     { type: integer, example: 15 }
        current_page: { type: integer, example: 1 }
        last_page:    { type: integer, example: 10 }
        from:         { type: integer, nullable: true }
        to:           { type: integer, nullable: true }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:   { type: string,  example: not_found }
        message: { type: string,  example: Resource not found }

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:    { type: string, example: johndoe }
        password:    { type: string, format: password }
        remember_me: { type: boolean, default: false, description: "Extends token lifetime to 30 days" }
        name:        { type: string, description: "Optional label stored against the token (e.g. 'mobile-app')" }

    LoginResult:
      type: object
      properties:
        token:      { type: string, example: "9f86d081884c7d659a2feaa0c55ad015…" }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user:       { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id:         { type: integer }
        username:   { type: string }
        email:      { type: string, format: email }
        first_name: { type: string }
        last_name:  { type: string }
        phone:      { type: string, nullable: true }
        userlevel:  { type: integer, description: "1 customer, 3 driver, 6 agency, 9 super-admin" }
        active:     { type: boolean }
        locker:     { type: string, nullable: true }
        name_off:   { type: string, nullable: true }
        agency_id:  { type: integer, nullable: true }
        created:    { type: string, format: date-time, nullable: true }

    Shipment:
      type: object
      properties:
        id:                         { type: integer }
        order_prefix:               { type: string }
        order_no:                   { type: string }
        tracking_number:            { type: string, description: "order_prefix concatenated with order_no" }
        order_date:                 { type: string, format: date-time, nullable: true }
        sender_id:                  { type: integer }
        sender_name:                { type: string, nullable: true }
        receiver_id:                { type: integer }
        receiver_name:              { type: string, nullable: true }
        recipient_type:             { type: string, enum: [user, recipient, sender], nullable: true }
        agency:                     { type: integer }
        origin_off:                 { type: integer }
        order_courier:              { type: integer }
        order_service_options:      { type: integer }
        order_deli_time:            { type: integer }
        order_payment_method:       { type: integer }
        driver_id:                  { type: integer }
        status:                     { type: integer }
        status_label:               { type: string, nullable: true }
        status_color:               { type: string, nullable: true }
        status_invoice:             { type: integer }
        is_pickup:                  { type: boolean }
        is_consolidate:             { type: boolean }
        total_weight:               { type: number }
        sub_total:                  { type: number }
        total_tax:                  { type: number }
        total_tax_insurance:        { type: number }
        total_tax_discount:         { type: number }
        total_tax_custom_tariffis:  { type: number }
        total_reexp:                { type: number }
        total_fixed_value:          { type: number }
        total_declared_value:       { type: number }
        total_order:                { type: number }
        due_date:                   { type: string, format: date-time, nullable: true }
        order_incomplete:           { type: boolean }

    ShipmentDetail:
      allOf:
        - $ref: '#/components/schemas/Shipment'
        - type: object
          properties:
            packages:
              type: array
              items: { $ref: '#/components/schemas/PackageLine' }
            tracking:
              type: array
              items: { $ref: '#/components/schemas/TrackingEvent' }

    PackageLine:
      type: object
      properties:
        id:             { type: integer }
        description:    { type: string, nullable: true }
        qty:            { type: number }
        weight:         { type: number }
        length:         { type: number }
        width:          { type: number }
        height:         { type: number }
        fixed_value:    { type: number }
        declared_value: { type: number }

    CreateShipmentRequest:
      type: object
      required:
        - sender_id
        - sender_address_id
        - recipient_id
        - recipient_address_id
        - agency
        - origin_off
        - order_item_category
        - order_package
        - order_courier
        - order_service_options
        - order_deli_time
        - order_payment_method
        - status_courier
        - order_date
      properties:
        sender_id:              { type: integer }
        sender_address_id:      { type: integer }
        recipient_id:           { type: integer }
        recipient_address_id:   { type: integer }
        recipient_type:
          type: string
          enum: [user, recipient, sender]
          default: recipient
          description: |
            How the recipient is resolved. `recipient` (default) points at a
            cdb_recipients row; `user` means the sender is their own recipient;
            `sender` marks a pre-alert-originated shipment.
        agency:                 { type: integer }
        origin_off:             { type: integer }
        order_item_category:    { type: integer }
        order_package:          { type: integer }
        order_courier:          { type: integer }
        order_service_options:  { type: integer }
        order_deli_time:        { type: integer }
        order_payment_method:   { type: integer }
        status_courier:         { type: integer }
        driver_id:              { type: integer, default: 0 }
        order_date:             { type: string, format: date }
        order_no:               { type: string, description: "Omit to auto-assign the next sequence number" }
        packages:
          type: array
          items:
            type: object
            properties:
              qty:            { type: integer, minimum: 1, default: 1 }
              description:    { type: string }
              length:         { type: number }
              width:          { type: number }
              height:         { type: number }
              weight:         { type: number }
              fixed_value:    { type: number }
              declared_value: { type: number }

    Customer:
      type: object
      properties:
        id:              { type: integer }
        username:        { type: string }
        email:           { type: string, format: email }
        first_name:      { type: string }
        last_name:       { type: string }
        phone:           { type: string, nullable: true }
        gender:          { type: string, enum: [M, F, O], nullable: true }
        notes:           { type: string, nullable: true }
        newsletter:      { type: boolean }
        active:          { type: boolean }
        locker:          { type: string, nullable: true }
        document_type:   { type: string, nullable: true }
        document_number: { type: string, nullable: true }
        agency_id:       { type: integer, nullable: true }
        name_off:        { type: string, nullable: true }
        created:         { type: string, format: date-time, nullable: true }

    CreateCustomerRequest:
      type: object
      required: [email, first_name, last_name, username, password]
      properties:
        email:           { type: string, format: email, maxLength: 100 }
        first_name:      { type: string, minLength: 2, maxLength: 80 }
        last_name:       { type: string, minLength: 2, maxLength: 80 }
        username:        { type: string, minLength: 4, maxLength: 50 }
        password:        { type: string, minLength: 8, maxLength: 100 }
        phone:           { type: string, maxLength: 30 }
        gender:          { type: string, enum: [M, F, O] }
        active:          { type: integer, enum: [0, 1], default: 1 }
        notes:           { type: string }
        document_type:   { type: string }
        document_number: { type: string }
        agency_id:       { type: integer }

    UpdateCustomerRequest:
      type: object
      properties:
        email:           { type: string, format: email, maxLength: 100 }
        first_name:      { type: string, minLength: 2, maxLength: 80 }
        last_name:       { type: string, minLength: 2, maxLength: 80 }
        phone:           { type: string, maxLength: 30 }
        gender:          { type: string, enum: [M, F, O] }
        active:          { type: integer, enum: [0, 1] }
        newsletter:      { type: integer, enum: [0, 1] }
        notes:           { type: string }
        document_type:   { type: string }
        document_number: { type: string }
        password:        { type: string, description: "Provide to rotate the password" }

    Recipient:
      type: object
      properties:
        id:         { type: integer }
        first_name: { type: string }
        last_name:  { type: string }
        email:      { type: string, format: email }
        phone:      { type: string, nullable: true }
        sender_id:  { type: integer }
        agency_id:  { type: integer, nullable: true }

    CreateRecipientRequest:
      type: object
      required: [first_name, last_name, email, sender_id]
      properties:
        first_name: { type: string, minLength: 2, maxLength: 80 }
        last_name:  { type: string, minLength: 2, maxLength: 80 }
        email:      { type: string, format: email, maxLength: 100 }
        phone:      { type: string, maxLength: 30 }
        sender_id:  { type: integer }
        address:    { type: string, description: "When present, an address row is created alongside the recipient" }
        country_id: { type: integer }
        state_id:   { type: integer }
        city_id:    { type: integer }
        zip_code:   { type: string }

    Address:
      type: object
      properties:
        id:           { type: integer }
        address:      { type: string }
        zip_code:     { type: string, nullable: true }
        country_id:   { type: integer }
        country_name: { type: string, nullable: true }
        state_id:     { type: integer }
        state_name:   { type: string, nullable: true }
        city_id:      { type: integer }
        city_name:    { type: string, nullable: true }

    TrackingEvent:
      type: object
      properties:
        t_date:       { type: string, format: date-time }
        comments:     { type: string, nullable: true }
        status_label: { type: string }
        status_color: { type: string }

    TrackingResult:
      type: object
      properties:
        type:            { type: string, enum: [shipment, package, consolidation] }
        tracking_number: { type: string }
        status:          { type: integer }
        status_label:    { type: string }
        status_color:    { type: string }
        order_date:      { type: string, format: date-time, nullable: true }
        due_date:        { type: string, format: date-time, nullable: true, description: "Shipments only" }
        total_order:     { type: number }
        is_pickup:       { type: boolean, description: "Shipments only" }
        events:
          type: array
          items: { $ref: '#/components/schemas/TrackingEvent' }

    PreAlert:
      type: object
      properties:
        id:             { type: integer }
        tracking:       { type: string }
        provider:       { type: string, nullable: true }
        courier_id:     { type: integer }
        courier_name:   { type: string, nullable: true }
        customer_id:    { type: integer }
        customer_name:  { type: string, nullable: true }
        price:          { type: number }
        description:    { type: string, nullable: true }
        estimated_date: { type: string, format: date, nullable: true }
        prealert_date:  { type: string, format: date-time, nullable: true }
        invoice_url:    { type: string, nullable: true }

    CreatePreAlertRequest:
      type: object
      required: [tracking, provider, courier_id, price, description, date]
      properties:
        tracking:    { type: string, minLength: 4, maxLength: 55 }
        provider:    { type: string, minLength: 2, maxLength: 100 }
        courier_id:  { type: integer }
        price:       { type: number, minimum: 0 }
        description: { type: string, minLength: 2, maxLength: 500 }
        date:        { type: string, format: date }

    Notification:
      type: object
      properties:
        id:          { type: integer }
        description: { type: string }
        type:        { type: integer, description: "shipping_type discriminator" }
        date:        { type: string, format: date-time }
        read:        { type: boolean }

    ReferenceItem:
      type: object
      description: |
        Shape varies slightly by endpoint. Most return `{ id, name }`. Countries
        add `code` (ISO3) and `phone_code`; states add `code` (ISO); statuses
        return `{ id, label, color }`; payment-methods add `days`.
      properties:
        id:    { type: integer }
        name:  { type: string }
        label: { type: string }
        color: { type: string }
        code:  { type: string }
        days:  { type: integer }
